ont-size:1.22rem;line-height:1.65;font-weight:800;margin:20px 0}.choices{display:grid;gap:11px}.choice{border:2px solid #dce4f2;background:#fff;border-radius:16px;padding:16px;text-align:left;font:inherit;line-height:1.5;min-height:60px;color:#22304c}.choice:disabled{opacity:1}.choice.correct{border-color:#13aa78;background:#e6f9f1}.choice.wrong{border-color:#e45f6c;background:#fff0f1}.answer{margin:16px 0;background:white;border-radius:18px;padding:18px;line-height:1.7}.answer strong{color:#245cb2}.actions{display:flex;gap:8px;margin-top:15px}.actions>*{flex:1}.bottom{position:fixed;bottom:0;left:0;right:0;max-width:680px;margin:auto;background:#fff;border-top:1px solid #e4eaf4;display:flex;padding:8px 9px max(8px,env(safe-area-inset-bottom))}.bottom button{flex:1;background:none;border:0;padding:8px 2px;color:#61708c;font:inherit;font-size:.75rem}.bottom button.on{color:#3154c6;font-weight:800}.bottom b{display:block;font-size:1.25rem}.empty{padding:25px;text-align:center;color:#65728c}@media(min-width:700px){.app{box-shadow:0 0 45px #20385b16}}button:focus-visible{outline:3px solid #f5a623;outline-offset:2px}
</style><main class="app" id="app"></main><script>

let state=JSON.parse(localStorage.getItem('ipq-v1')||'{"xp":0,"streak":0,"last":"","history":{},"wrong":[],"seen":[]}');let view='home',category='すべて',queue=[],idx=0,answered=false,chosen=-1,mode='';const app=document.getElementById('app');function save(){localStorage.setItem('ipq-v1',JSON.stringify(state))}function today(){return new Date().toLocaleDateString('sv-SE')}function nav(v){view=v;render()}function start(m){mode=m;let ids=Q.map((_,i)=>i).filter(i=>category==='すべて'||Q[i][0]===category);if(m==='review')ids=ids.filter(i=>state.wrong.includes(i));if(m==='new')ids=ids.filter(i=>!state.seen.includes(i));queue=ids.sort(()=>Math.random()-.5).slice(0,m==='quick'?10:100);idx=0;answered=false;chosen=-1;view=queue.length?'quiz':'empty';render()}function pick(n){if(answered)return;chosen=n;answered=true;let i=queue[idx],ok=n===Q[i][4];state.seen=[...new Set([...state.seen,i])];state.history[i]=(state.history[i]||0)+1;if(ok){state.xp+=10;state.wrong=state.wrong.filter(x=>x!==i)}else state.wrong=[...new Set([...state.wrong,i])];let d=today();state.streak=d===state.last?state.streak:state.last===new Date(Date.now()-864e5).toLocaleDateString('sv-SE')?state.streak+1:1;state.last=d;save();render()}function next(){idx++;answered=false;chosen=-1;view=idx>=queue.length?'done':'quiz';render()}function shell(content,tab='home'){app.innerHTML=`<header><div class="brand">✦ ITパスポート QUEST</div><div class="pill">⚡ ${state.xp} XP</div></header>${content}<div class="bottom"><button class="${tab==='home'?'on':''}" onclick="nav('home')"><b>⌂</b>ホーム</button><button class="${tab==='study'?'on':''}" onclick="nav('study')"><b>▦</b>分野別</button><button class="${tab==='record'?'on':''}" onclick="nav('record')"><b>◉</b>記録</button></div>`}function render(){if(view==='home'){shell(`<div class="hero"><small>毎日少しずつ、理解を積み重ねよう</small><h1>今日の10問に挑戦</h1><div class="stats"><div><span>${state.streak}</span> 日連続</div><div><span>${state.seen.length}</span> / ${Q.length} 問学習</div></div><p><button class="btn" onclick="category='すべて';start('quick')">10問スタート →</button></p></div><h2 class="section">学習メニュー</h2><div class="grid"><button class="card" onclick="nav('study')"><span class="icon">▦</span><b>分野別に解く</b><small>苦手な分野を集中演習</small></button><button class="card" onclick="category='すべて';start('review')"><span class="icon">↺</span><b>間違いを復習</b><small>${state.wrong.length}問をもう一度</small></button><button class="card" onclick="category='すべて';start('new')"><span class="icon">✧</span><b>未回答に挑戦</b><small>新しい問題を優先</small></button><button class="card" onclick="nav('record')"><span class="icon">◉</span><b>学習記録</b><small>進み具合を確認</small></button></div><div class="panel"><b>このアプリの問題について</b><p class="muted">現行シラバス Ver.6.5 と公開問題の出題形式を参考にしたオリジナル問題です。公開過去問の転載ではありません。2027年度の新制度シラバスは案の段階です。</p></div>`);return}if(view==='study'){shell(`<h1>分野別に解く</h1><div class="filters">${['すべて','ストラテジ','マネジメント','テクノロジ'].map(c=>`<button class="chip ${category===c?'active':''}" onclick="category='${c}';render()">${c}</button>`).join('')}</div><div class="panel"><h2>${category}</h2><p class="muted">${Q.filter(q=>category==='すべて'||q[0]===category).length}問・解答後に解説を表示</p><button class="btn full" onclick="start('all')">この分野を始める →</button></div>${[...new Set(Q.filter(q=>category==='すべて'||q[0]===category).map(q=>q[1]))].map(s=>`<div class="panel"><b>${s}</b><span class="muted">　${Q.filter(q=>q[1]===s).length}問</span></div>`).join('')}`,'study');return}if(view==='record'){shell(`<h1>学習記録</h1><div class="hero"><div class="stats"><div><span>${state.xp}</span> XP</div><div><span>${state.streak}</span> 日連続</div></div><p>${state.seen.length} / ${Q.length} 問に挑戦</p><div class="progress"><i style="width:${100*state.seen.length/Q.length}%"></i></div></div>${['ストラテジ','マネジメント','テクノロジ'].map(c=>{let all=Q.map((q,i)=>q[0]===c?i:-1).filter(i=>i>=0),n=all.filter(i=>state.seen.includes(i)).length;return `<div class="panel"><b>${c}</b><p class="muted">${n} / ${all.length} 問学習</p><div class="progress"><i style="width:${100*n/all.length}%"></i></div></div>`}).join('')}<div class="panel"><b>復習待ち ${state.wrong.length}問</b><p class="muted">間違えた問題は正解すると復習リストから外れます。記録はこの端末のブラウザに保存されます。</p><button class="btn secondary full" onclick="category='すべて';start('review')">復習する</button></div>`,'record');return}if(view==='empty'){shell(`<div class="empty"><h2>対象の問題はありません</h2><p>別のモードで演習してみましょう。</p><button class="btn" onclick="nav('home')">ホームに戻る</button></div>`);return}if(view==='done'){shell(`<div class="hero"><h1>チャレンジ完了！</h1><p>${queue.length}問を終えました。復習で理解を定着させましょう。</p><div class="stats"><div><span>${state.xp}</span> XP</div><div><span>${state.wrong.length}</span> 問復習待ち</div></div></div><button class="btn full" onclick="nav('home')">ホームに戻る</button>`);return}let q=Q[queue[idx]],correct=q[4];shell(`<div class="quiztop"><button class="back" onclick="nav('home')">← 戻る</button><span class="pill">${idx+1} / ${queue.length}</span></div><div class="progress"><i style="width:${100*(idx+1)/queue.length}%"></i></div><p class="muted">${q[0]} ／ ${q[1]}</p><div class="question">${q[2]}</div><div class="choices">${q[3].map((x,n)=>`<button class="choice ${answered?(n===correct?'correct':n===chosen?'wrong':''):''}" onclick="pick(${n})" ${answered?'disabled':''}><b>${'ABCD'[n]}.</b> ${x}</button>`).join('')}</div>${answered?`<div class="answer"><strong>${chosen===correct?'正解！ +10 XP':'もう一度覚えよう'}</strong><p>${q[5]}</p><button class="btn full" onclick="next()">${idx===queue.length-1?'結果を見る':'次の問題 →'}</button></div>`:''}`)}render();
</script></html>
